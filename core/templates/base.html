{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>We conn - Software de Gestão para Manutenção Industrial 4.0</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" >
    <!-- Icon -->
    <link rel="stylesheet" href="{% static 'fonts/line-icons.css' %}">
    <!-- Owl carousel -->
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.css' %}">
    
    <!-- Animate -->
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <!-- Main Style -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <!-- Responsive Style -->
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Personalização de cores -->
    <style>
      /* Cor primária para botões, links e elementos destacados */
      .btn-common, .btn-common:hover, .btn-common:focus {
        background-color: #3383ff !important;
        border-color: #3383ff !important;
      }
      
      /* Cor para ícones e elementos visuais */
      .icon-box i, .lni-check-mark-circle, .plan-features li:before, 
      .title h3, .price, .section-title, .plan-card:hover, .plan-card.featured {
        color: #3383ff !important;
      }
      
      /* Cor para bordas, destaques e backgrounds */
      .shape, .icon-box, .plan-card:hover, .plan-card.featured, #pricing .active {
        border-color: #3383ff !important;
      }
      
      /* Backgrounds com a nova cor */
      .back-to-top, .icon-box, .table .icon-box, #active-tb .icon-box,
      .cta-section, .page-header {
        background-color: #3383ff !important;
      }
      
      /* Linhas e separadores */
      .shape::before, .shape::after {
        background-color: #3383ff !important;
      }
      
      /* Cards com borda destacada */
      .plan-card:hover, .plan-card.featured {
        border-color: #3383ff !important;
        box-shadow: 0 5px 15px rgba(51, 131, 255, 0.1) !important;
      }
      
      /* Backgrounds com cor mais clara (variação) */
      .bg-gray, .plan-card.featured, .faq-item .card-header {
        background-color: #f8faff !important;
      }
      
      /* Elements with this color */
      .breadcrumb-wrapper h2, .breadcrumb li a:hover {
        color: #3383ff !important;
      }

          .page-header {
        background-color: rgba(51, 131, 255, 0.85) !important;
        background-blend-mode: multiply !important;
      }
      
      /* Cores para o menu de navegação */
      .navbar-expand-md .navbar-nav .nav-link:hover,
      .navbar-expand-md .navbar-nav .active>.nav-link,
      .navbar-expand-md .navbar-nav .nav-link:focus {
        color: #3383ff !important;
      }

      /* Ajuste para barra de navegação no topo */
      .navbar-expand-md.bg-inverse {
        background: rgba(255, 255, 255, 0.95) !important;
      }

        /* Solução para sobreposição da navbar */
      #header-wrap + section, 
      #header-wrap + .section-padding, 
      #header-wrap + #content {
        padding-top: 120px !important; /* Ajuste este valor conforme necessário */
      }
      
      /* Ajuste específico para a página header */
      .page-header {
        margin-top: 70px !important; /* Altura aproximada da navbar */
      }

      /* Cores para botões, contornos e linhas divisórias */
      .btn-common, .btn-common:hover, .btn-common:focus,
      .plan-card:hover, .plan-card.featured,
      .nav-link.btn-common, .form-control:focus {
        background-color: #3383ff !important;
        border-color: #3383ff !important;
      }
      
      /* Bordas em elementos */
      .card, .form-control:focus, .btn-border, .btn-border:hover,
      .table, #active-tb, .plan-card:hover, .plan-card.featured {
        border-color: #3383ff !important;
      }
      
      /* Divisores e linhas */
      .shape, .shape::before, .shape::after, 
      .plan-header, .cta-text, .section-title::after {
        background-color: #3383ff !important;
      }
      
      /* Sombras com a cor */
      .card:hover, .plan-card:hover, .plan-card.featured {
        box-shadow: 0 5px 15px rgba(51, 131, 255, 0.1) !important;
      }
      
      /* Botões com borda */
      .btn-border {
        color: #3383ff !important;
        border: 2px solid #3383ff !important;
      }
      
      /* Focus em inputs */
      .form-control:focus {
        box-shadow: 0 0 0 0.2rem rgba(51, 131, 255, 0.25) !important;
      }

    </style>
  </head>
  <body>
    <!-- O conteúdo da página será inserido aqui -->
    {% block content %}  {% endblock %}

    <!-- Go to Top Link -->
    <a href="#" class="back-to-top">
    	<i class="lni-arrow-up"></i>
    </a>
    
    <!-- Preloader -->
    <div id="preloader">
      <div class="loader" id="loader-1"></div>
    </div>
    <!-- End Preloader -->
    
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="{% static 'js/jquery-min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/wow.js' %}"></script>
    <script src="{% static 'js/jquery.nav.js' %}"></script>
    <script src="{% static 'js/scrolling-nav.js' %}"></script>
    <script src="{% static 'js/jquery.easing.min.js' %}"></script>  
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/form-validator.min.js' %}"></script>
    <script src="{% static 'js/contact-form-script.min.js' %}"></script>
     
    <script>
      // Aplicar estilo consistente nos cabeçalhos de página
      document.addEventListener('DOMContentLoaded', function() {
        const pageHeaders = document.querySelectorAll('.page-header');
        pageHeaders.forEach(function(header) {
          // Aplicar overlay azul em todas as imagens de fundo dos cabeçalhos
          header.style.backgroundColor = 'rgba(51, 131, 255, 0.85)';
          header.style.backgroundBlendMode = 'multiply';
          
          // Garantir que o texto seja visível
          const headingElements = header.querySelectorAll('h2, .breadcrumb-wrapper');
          headingElements.forEach(function(element) {
            element.style.color = '#ffffff';
          });
        });
      });
    </script>
  </body>
</html>
