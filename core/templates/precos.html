{% load static %}
{% load custom_tags %}
<section id="pricing" class="section-padding">
    <div class="container">
      <div class="section-header text-center">          
        <h2 class="section-title wow fadeInDown" data-wow-delay="0.3s">Planos de Assinatura</h2>
        <div class="shape wow fadeInDown" data-wow-delay="0.3s"></div>
      </div>
      <div class="row">
        {% for plano in planos %}
        <div class="col-lg-4 col-md-6 col-xs-12 {% if plano.nivel == 'nivel2' %}active{% endif %}">
          <div class="table wow {% if plano.nivel == 'nivel1' %}fadeInLeft{% elif plano.nivel == 'nivel2' %}fadeInUp{% else %}fadeInRight{% endif %}" {% if plano.nivel == 'nivel2' %}id="active-tb"{% endif %} data-wow-delay="1.2s">
            <div class="icon-box">
              <i class="{% if plano.nivel == 'nivel1' %}lni-package{% elif plano.nivel == 'nivel2' %}lni-drop{% else %}lni-star{% endif %}"></i>
            </div>
            
            <div class="pricing-header">
              <p class="price-value">R${{ plano.preco }}<span> /mês</span></p>
            </div>
            
            <div class="title">
              <h3>{{ plano.nome }}</h3>
            </div>
            <ul class="description">
              {% for recurso in plano.recursos|split_string %}
              <li>{{ recurso|trim }}</li>
              {% endfor %}
            </ul>
            <a href="{% url 'cadastro_usuario' %}" class="btn btn-common">Contratar Agora</a>
          </div> 
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
